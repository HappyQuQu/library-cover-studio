name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to verify
        required: false
        default: ''
        type: string
      build_images:
        description: Build and smoke-test native images; release callers build their final images separately
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install native build and font dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            python3 make g++ pkg-config libcairo2-dev libpango1.0-dev \
            libjpeg-dev libgif-dev librsvg2-dev fonts-noto-cjk

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release version consistency
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const read = path => JSON.parse(readFileSync(path, 'utf8'));
          const versions = ['package.json', 'backend/package.json', 'web/package.json'].map(path => read(path).version);
          versions.push(read('.release-please-manifest.json')['.']);
          if (new Set(versions).size !== 1) throw new Error('Package and release manifest versions must match');
          JS

      - name: Run isolated tests
        run: pnpm test

      - name: Build frontend and backend
        run: pnpm build

  docker:
    name: Build unified image
    # PR/manual events have no workflow_call inputs; only an explicit false skips images.
    if: toJSON(inputs.build_images) != 'false'
    uses: ./.github/workflows/native-images.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
