name: Native image verification

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to build
        required: true
        type: string
      publish:
        description: Stage images by immutable digest and export verified digests
        default: false
        type: boolean
      image:
        description: Registry repository for staged images
        default: lcs-smoke
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  image:
    name: Verify ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download final image metadata
        if: inputs.publish
        uses: actions/download-artifact@v4
        with:
          name: final-image-metadata
          path: ${{ runner.temp }}/image-metadata

      - name: Read final OCI labels
        if: inputs.publish
        id: metadata
        env:
          SOURCE: ${{ inputs.ref }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, secrets
          metadata = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'image-metadata/final-image-metadata.json').read_text())
          labels = metadata['labels']
          assert labels['org.opencontainers.image.revision'] == os.environ['SOURCE']
          boundary = secrets.token_hex(16)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('labels<<' + boundary + '\n')
              output.write('\n'.join(key + '=' + value for key, value in labels.items()) + '\n')
              output.write(boundary + '\n')
          PY

      - name: Build native image once
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: ${{ !inputs.publish }}
          tags: ${{ !inputs.publish && 'lcs-smoke:ci' || '' }}
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: ${{ inputs.publish && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', inputs.image) || '' }}
          cache-from: type=gha,scope=unified-${{ matrix.arch }}
          cache-to: type=gha,scope=unified-${{ matrix.arch }},mode=max
          sbom: ${{ inputs.publish }}
          provenance: ${{ inputs.publish }}

      - name: Verify the built image and data persistence
        env:
          PUBLISH: ${{ inputs.publish }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          image='lcs-smoke:ci'
          if [[ "${PUBLISH}" == 'true' ]]; then
            image="${IMAGE}@${DIGEST}"
            docker pull --platform "linux/${ARCH}" "${image}"
          fi
          test "$(docker image inspect "${image}" --format '{{.Architecture}}')" = "${ARCH}"
          package_version="$(node -p "require('./package.json').version")"
          python3 scripts/smoke-container.py --image "${image}" --expected-version "${package_version}"

      - name: Record verified digest
        if: inputs.publish
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verified-digests'
          root.mkdir()
          record = dict(image=os.environ['IMAGE'], digest=os.environ['DIGEST'], arch=os.environ['ARCH'],
                        source=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                        version=json.loads(pathlib.Path('package.json').read_text())['version'])
          (root / (record['arch'] + '.json')).write_text(json.dumps(record))
          PY

      - name: Upload verified digest
        if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: verified-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/verified-digests/*.json
          if-no-files-found: error
          retention-days: 1
