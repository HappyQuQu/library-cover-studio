services:
  library-cover-studio:
    image: ${LCS_IMAGE_NAMESPACE:-evanqu}/library-cover-studio:${LCS_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?请设置 ENCRYPTION_KEY}
      FRONTEND_URL: ${LCS_PUBLIC_URL:-${FRONTEND_URL:-}}
    volumes:
      - backend_data:/app/data

volumes:
  backend_data:
