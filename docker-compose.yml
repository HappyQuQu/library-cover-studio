version: "3.8"

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: lcs-postgres
    environment:
      POSTGRES_DB: library_cover_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-library_cover_studio_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    ports:
      - "5432:5432"
    networks:
      - lcs-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存和队列
  redis:
    image: redis:7-alpine
    container_name: lcs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lcs-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LibraryCoverStudio 主应用
  app:
    build: .
    container_name: lcs-app
    environment:
      NODE_ENV: production
      PORT: 3001

      # 数据库配置
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: library_cover_studio
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-library_cover_studio_pass}

      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # 应用配置
      FRONTEND_URL: http://localhost:3000
      TIMEZONE: Asia/Shanghai

      # JWT 密钥
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}

      # 文件上传配置
      UPLOAD_PATH: /app/uploads
      MAX_FILE_SIZE: 50MB

    ports:
      - "3001:3001"
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    networks:
      - lcs-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx 反向代理 (可选)
  nginx:
    image: nginx:alpine
    container_name: lcs-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - app_uploads:/usr/share/nginx/html/uploads
    networks:
      - lcs-network
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_uploads:
    driver: local
  app_logs:
    driver: local

networks:
  lcs-network:
    driver: bridge
